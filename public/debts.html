<div class="page-navigation">
    <a href="#" data-navigate="dashboard" class="btn btn-outline-primary">← Back to Dashboard</a>
</div>

<div class="page-header">
    <h1>Debts</h1>
    <p>Manage debts owed and money you owe</p>
</div>

<div class="stats-grid">
    <div class="stat-card">
        <div class="stat-icon">D</div>
        <div class="stat-content">
            <h3 id="total-debts">0</h3>
            <p>Total Debts</p>
            <small>This month</small>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">$</div>
        <div class="stat-content">
            <h3 id="total-outstanding">$0.00</h3>
            <p>Outstanding</p>
            <small>All time</small>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">O</div>
        <div class="stat-content">
            <h3 id="overdue-debts">0</h3>
            <p>Overdue</p>
            <small>All time</small>
        </div>
    </div>
</div>

<div class="card mt-4">
    <div class="card-header">
        <h3>All Debts</h3>
        <button class="btn btn-primary" onclick="showAddDebtModal()">Add Debt</button>
    </div>
    <div class="card-body" id="debts-content">
        <div class="text-center"><div class="spinner"></div><p>Loading...</p></div>
    </div>
</div>

<!-- Debt Modal -->
<div id="debt-modal" class="modal" style="display:none">
    <div class="modal-content">
        <div class="modal-header">
            <h4 id="debt-modal-title">Add Debt</h4>
            <span class="modal-close" onclick="closeDebtModal()">&times;</span>
        </div>
        <div class="modal-body">
            <form id="debt-form" onsubmit="event.preventDefault();saveDebt()">
                <div class="form-group"><label>Debtor Name *</label><input type="text" id="debt_name" class="form-control" required></div>
                <div class="form-group"><label>Phone</label><input type="tel" id="debt_phone" class="form-control"></div>
                <div class="form-group"><label>Email</label><input type="email" id="debt_email" class="form-control"></div>
                <div class="form-group"><label>Type *</label>
                    <select id="debt_type" class="form-control" required>
                        <option value="owed_to_us">Money Owed to Us</option>
                        <option value="we_owe">Money We Owe</option>
                    </select>
                </div>
                <div class="form-group"><label>Amount ($) *</label><input type="number" id="debt_amount" class="form-control" step="0.01" min="0" required></div>
                <div class="form-group"><label>Due Date</label><input type="date" id="debt_due" class="form-control"></div>
                <div class="form-group"><label>Description</label><textarea id="debt_desc" class="form-control" rows="2"></textarea></div>
                <div class="form-group"><label>Payment Schedule</label><input type="text" id="debt_schedule" class="form-control" placeholder="e.g., Weekly installments"></div>
                <div class="form-group"><label>Notes</label><textarea id="debt_notes" class="form-control" rows="2"></textarea></div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeDebtModal()">Cancel</button>
            <button class="btn btn-primary" onclick="saveDebt()">Save Debt</button>
        </div>
    </div>
</div>

<style>
.modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
.modal-content { background: white; margin: 5% auto; padding: 0; border-radius: 0.5rem; width: 90%; max-width: 600px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
.modal-header { padding: 1rem 1.5rem; border-bottom: 1px solid #e9ecef; display: flex; justify-content: space-between; align-items: center; }
.modal-body { padding: 1.5rem; }
.modal-footer { padding: 1rem 1.5rem; border-top: 1px solid #e9ecef; display: flex; justify-content: flex-end; gap: 0.5rem; }
.modal-close { font-size: 1.5rem; cursor: pointer; color: #6c757d; }
</style>

<script>
let editingDebtId = null;

function showAddDebtModal() {
    editingDebtId = null;
    document.getElementById('debt-modal-title').textContent = 'Add Debt';
    document.getElementById('debt-form').reset();
    document.getElementById('debt-modal').style.display = 'block';
}

async function saveDebt() {
    const data = {
        debtor_name: document.getElementById('debt_name').value,
        debtor_phone: document.getElementById('debt_phone').value,
        debtor_email: document.getElementById('debt_email').value,
        debt_type: document.getElementById('debt_type').value,
        amount: parseFloat(document.getElementById('debt_amount').value) || 0,
        due_date: document.getElementById('debt_due').value,
        description: document.getElementById('debt_desc').value,
        payment_schedule: document.getElementById('debt_schedule').value,
        notes: document.getElementById('debt_notes').value
    };

    if (!data.debtor_name || !data.debt_type || !data.amount) { alert('Name, type, and amount required'); return; }

    try {
        const url = editingDebtId ? `/api/debts/${editingDebtId}` : '/api/debts';
        const res = await fetch(url, {
            method: editingDebtId ? 'PUT' : 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        if (res.ok) {
            closeDebtModal();
            loadDebtsData();
            showNotification('Debt saved!', 'success');
        }
    } catch (err) {
        showNotification('Error: ' + err.message, 'error');
    }
}

function closeDebtModal() {
    document.getElementById('debt-modal').style.display = 'none';
    editingDebtId = null;
}

async function loadDebtsData() {
    try {
        const [statsRes, debtsRes] = await Promise.all([
            fetch('/api/debts/stats').then(r => r.json()),
            fetch('/api/debts').then(r => r.json())
        ]);
        const stats = statsRes.data || {};
        document.getElementById('total-debts').textContent = stats.total_debts || 0;
        document.getElementById('total-outstanding').textContent = '$' + (parseFloat(stats.total_outstanding) || 0).toFixed(2);
        document.getElementById('overdue-debts').textContent = stats.overdue_debts || 0;

        const debts = debtsRes.data || [];
        if (debts.length === 0) {
            document.getElementById('debts-content').innerHTML = '<p class="text-muted">No debts found.</p>';
            return;
        }

        let html = '<div class="table-responsive"><table class="table"><thead><tr><th>Debtor</th><th>Type</th><th>Amount</th><th>Paid</th><th>Outstanding</th><th>Due Date</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
        debts.forEach(d => {
            const outstanding = (parseFloat(d.amount) || 0) - (parseFloat(d.paid_amount) || 0);
            const typeText = d.debt_type === 'owed_to_us' ? 'Owed to Us' : 'We Owe';
            const sc = outstanding <= 0 ? 'success' : d.status === 'active' ? 'warning' : 'secondary';
            html += `<tr>
                <td>${d.debtor_name}</td>
                <td><span class="badge badge-${d.debt_type === 'owed_to_us' ? 'success' : 'warning'}">${typeText}</span></td>
                <td>$${(parseFloat(d.amount) || 0).toFixed(2)}</td>
                <td>$${(parseFloat(d.paid_amount) || 0).toFixed(2)}</td>
                <td>$${outstanding.toFixed(2)}</td>
                <td>${d.due_date ? new Date(d.due_date).toLocaleDateString() : 'N/A'}</td>
                <td><span class="badge badge-${sc}">${d.status}</span></td>
                <td>
                    <button class="btn btn-sm btn-info" onclick="ViewDebt(${d.id})">View</button>
                    <button class="btn btn-sm btn-primary" onclick="EditDebt(${d.id})">Edit</button>
                    ${outstanding > 0 && d.status === 'active' ? `<button class="btn btn-sm btn-success" onclick="AddDebtPayment(${d.id})">Pay</button>` : ''}
                </td>
            </tr>`;
        });
        html += '</tbody></table></div>';
        document.getElementById('debts-content').innerHTML = html;
    } catch (err) {
        document.getElementById('debts-content').innerHTML = '<p class="text-danger">Error loading debts.</p>';
    }
}

function ViewDebt(id) { showNotification(`Viewing debt ${id}`, 'info'); }
function EditDebt(id) { showNotification(`Edit debt ${id}`, 'info'); }
function AddDebtPayment(id) { showNotification(`Add payment to debt ${id}`, 'info'); }

// Initialize
loadDebtsData();
</script>
